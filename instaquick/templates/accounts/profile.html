{% extends "base.html" %}
{% block content %}
<div class="auth-wrap">
    <form method="post" class="auth-card" enctype="multipart/form-data" id="profileForm">
        {% csrf_token %}
        <h2>My Profile & Address</h2>
        {{ form.as_p }}
        <div id="map" style="height:250px;border-radius:10px;margin:10px 0;"></div>
        <button type="submit" class="btn-primary">Save Details</button>
    </form>
</div>
{% endblock %}
{% block extra_js %}
<script src="https://maps.googleapis.com/maps/api/js?key={{ GOOGLE_MAPS_API_KEY }}&callback=initProfileMap" async defer></script>
<script>
function initProfileMap(){
    const center = {lat: 17.3850, lng: 78.4867}; // default: Hyderabad
    const map = new google.maps.Map(document.getElementById("map"), {zoom: 13, center});
    const marker = new google.maps.Marker({position: center, map, draggable: true});
    marker.addListener("dragend", () => {
        const pos = marker.getPosition();
        document.getElementById("id_latitude").value = pos.lat();
        document.getElementById("id_longitude").value = pos.lng();
    });
}
</script>
{% endblock %}
